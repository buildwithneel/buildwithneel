name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *" # Runs every 6 hours
  push:
    branches:
      - main
    paths-ignore:
      - 'profile/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1
        continue-on-error: true
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&theme=dark&include_all_commits=true'
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1
        continue-on-error: true
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&theme=dark'
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Validate generated SVGs
        run: |
          # Reject any file that isn't a valid SVG (e.g. Vercel "DEPLOYMENT_PAUSED" error pages)
          for f in profile/stats.svg profile/top-langs.svg; do
            if [ -s "$f" ] && ! grep -q "<svg" "$f"; then
              echo "WARNING: $f does not contain a valid SVG — discarding corrupted file"
              git checkout HEAD -- "$f" 2>/dev/null || rm -f "$f"
            fi
          done

      - name: Commit and push updated stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --staged --quiet; then
            echo "No changes in stats detected."
          else
            git commit -m "chore(stats): update GitHub stats SVGs [skip ci]"
            git push
          fi
