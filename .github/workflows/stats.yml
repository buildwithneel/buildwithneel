name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *" # Runs every 6 hours
  push:
    branches:
      - main
    paths-ignore:
      - 'profile/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1
        continue-on-error: true
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&theme=dark&include_all_commits=true'
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1
        continue-on-error: true
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&theme=dark'
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Validate generated SVGs
        run: |
          # Reject files that are not valid SVGs OR contain known error messages
          for f in profile/stats.svg profile/top-langs.svg; do
            if [ ! -s "$f" ]; then
              echo "INFO: $f is empty or missing — keeping last committed version"
              git checkout HEAD -- "$f" 2>/dev/null || true
              continue
            fi
            if ! grep -q "<svg" "$f"; then
              echo "WARNING: $f is not a valid SVG (no <svg> tag) — reverting"
              git checkout HEAD -- "$f" 2>/dev/null || rm -f "$f"
              continue
            fi
            # Catch error SVGs from the soulteary action (API errors render as SVG too)
            if grep -qiE "Something went wrong|FORBIDDEN|Resource not accessible|DEPLOYMENT_PAUSED|rate limit" "$f"; then
              echo "WARNING: $f contains an error message — reverting to last good version"
              git checkout HEAD -- "$f" 2>/dev/null || rm -f "$f"
              continue
            fi
            echo "OK: $f is a valid SVG"
          done

      - name: Commit and push updated stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --staged --quiet; then
            echo "No changes in stats detected."
          else
            git commit -m "chore(stats): update GitHub stats SVGs [skip ci]"
            git push
          fi
